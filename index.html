<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auftragsbuch</title>
<meta name="description" content="Arbeitszeit und Honorar erfassen – passwortgeschützt, mit PDF-Berichten.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Auftragsbuch">
<meta name="theme-color" content="#F2EFE9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>

<div id="app"></div>

<!-- Sicherung aus einer Datei einspielen -->
<input type="file" id="fileimp" accept="application/json,.json" hidden onchange="A.importDatei(this)">

<!-- Berichts-Vorschau: am Bildschirm sichtbar, beim Drucken die einzige Seite -->
<div id="reportbar" class="reportbar" hidden>
  <button class="btn btn-line btn-sm" id="reportback">← Zurück</button>
  <span class="reportbar-t" id="reportbar-t"></span>
  <button class="btn btn-fill btn-sm" style="flex:none" id="reportprint">Drucken / als PDF sichern</button>
</div>
<div id="report" class="report" hidden></div>

<script src="app.js?v=11"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
</body>
</html>
